name: kinfa-openedu-watch

on:
  # 자동 실행 중단: kinfa 가 해외 IP 에는 로그인 페이지를 주지 않아 GitHub 러너에서는
  # 로그인이 불가능하다. 감시는 한국 IP 인 Oracle 서버(1분 간격 cron)가 전담한다.
  workflow_dispatch:

# 감시 중인 실행을 예비 트리거가 죽이지 않도록 취소가 아니라 대기시킨다.
# 대기하던 실행은 시간대가 끝난 뒤 시작되므로 한 번만 확인하고 바로 끝난다.
concurrency:
  group: kinfa-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 이전 실행의 세션 쿠키와 알림 이력을 재사용 (매번 로그인/중복 알림 방지)
      - uses: actions/cache@v4
        with:
          path: |
            state.txt
            cookies.txt
            lastlogin.txt
          key: kinfa-state-${{ github.run_id }}
          restore-keys: kinfa-state-

      - run: python watch.py
        env:
          KINFA_ID: ${{ secrets.KINFA_ID }}
          KINFA_PW: ${{ secrets.KINFA_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
