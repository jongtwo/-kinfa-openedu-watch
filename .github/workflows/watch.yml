name: kinfa-openedu-watch

on:
  schedule:
    # 저빈도 cron("50 0 * * *" 등)은 아예 실행되지 않는 것을 실측으로 확인했다.
    # */5 는 GitHub 이 40~60분으로 늦추지만 꾸준히 실행되는 유일한 설정이라 이걸 쓴다.
    # 이렇게 뜬 실행이 감시 시간대 안이면 시간대가 끝날 때까지 1분마다 확인한다.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 감시 중인 실행을 예비 트리거가 죽이지 않도록 취소가 아니라 대기시킨다.
# 대기하던 실행은 시간대가 끝난 뒤 시작되므로 한 번만 확인하고 바로 끝난다.
concurrency:
  group: kinfa-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 이전 실행의 세션 쿠키와 알림 이력을 재사용 (매번 로그인/중복 알림 방지)
      - uses: actions/cache@v4
        with:
          path: |
            state.txt
            cookies.txt
          key: kinfa-state-${{ github.run_id }}
          restore-keys: kinfa-state-

      - run: python watch.py
        env:
          KINFA_ID: ${{ secrets.KINFA_ID }}
          KINFA_PW: ${{ secrets.KINFA_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
