name: kinfa-openedu-watch

on:
  schedule:
    # 하루 1회 cron 은 고빈도 cron 처럼 심하게 지연되지 않는다.
    # 09:50 KST 에 뜬 실행이 14:30 KST 까지 살아 있으면서 1분마다 확인한다.
    - cron: "50 0 * * *"
    # 위 트리거가 건너뛰어졌을 때를 대비한 예비 (10:20 KST)
    - cron: "20 1 * * *"
  workflow_dispatch:

# 새 실행이 뜨면 이전 실행을 넘겨받는다 (중복 감시 방지)
concurrency:
  group: kinfa-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # 이전 실행의 세션 쿠키와 알림 이력을 재사용 (매번 로그인/중복 알림 방지)
      - uses: actions/cache@v4
        with:
          path: |
            state.txt
            cookies.txt
          key: kinfa-state-${{ github.run_id }}
          restore-keys: kinfa-state-

      - run: python watch.py
        env:
          KINFA_ID: ${{ secrets.KINFA_ID }}
          KINFA_PW: ${{ secrets.KINFA_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
